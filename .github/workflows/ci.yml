name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_PATH: /Applications/Xcode_26.4.1.app
  SWIFTLINT_VERSION: 0.63.3
  XCODEGEN_VERSION: 2.46.0

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_PATH"

      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: swift-format
        run: swift format lint --recursive --strict Packages XcodeReclaim XcodeReclaimTests

  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select --switch "$XCODE_PATH"

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build
        timeout-minutes: 10
        run: |
          xcodebuild build-for-testing \
            -project XcodeReclaim.xcodeproj \
            -scheme XcodeReclaimCI \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Test under the thread sanitizer
        timeout-minutes: 10
        run: |
          xcodebuild test-without-building \
            -project XcodeReclaim.xcodeproj \
            -scheme XcodeReclaimCI \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/XcodeReclaimCI.xcresult"

      - name: Keep the result bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: XcodeReclaimCI.xcresult
          if-no-files-found: ignore
          path: ${{ runner.temp }}/XcodeReclaimCI.xcresult

      - name: Report the tests and the coverage
        if: always()
        run: python3 .github/scripts/test_metrics.py "$RUNNER_TEMP/XcodeReclaimCI.xcresult" "$RUNNER_TEMP/badges" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the badges
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: badges
          if-no-files-found: ignore
          path: ${{ runner.temp }}/badges

  badges:
    name: Publish badges
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Take the badges from the test job
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: badges
          path: badges

      - name: Push them to the badges branch
        if: steps.download.outcome == 'success'
        run: |
          cd badges
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests.json coverage.json
          git commit -q -m "Badges for ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

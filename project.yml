name: XcodeReclaim

options:
  bundleIdPrefix: com.boztepe
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: X8F92F5YZ5
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    OTHER_SWIFT_FLAGS: "$(inherited) -enable-upcoming-feature MemberImportVisibility"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  XcodeReclaimCore:
    path: Packages/XcodeReclaimCore
  XcodeReclaimEngine:
    path: Packages/XcodeReclaimEngine
  XcodeReclaimInfra:
    path: Packages/XcodeReclaimInfra
  XcodeReclaimPresentation:
    path: Packages/XcodeReclaimPresentation
  XcodeReclaimUI:
    path: Packages/XcodeReclaimUI

targets:
  XcodeReclaim:
    type: application
    platform: macOS
    sources:
      - XcodeReclaim
    dependencies:
      - package: XcodeReclaimCore
      - package: XcodeReclaimEngine
      - package: XcodeReclaimInfra
      - package: XcodeReclaimPresentation
      - package: XcodeReclaimUI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.boztepe.XcodeReclaim
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "XcodeReclaim looks here for copies of Xcode, and measures the room each one takes."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "XcodeReclaim looks here for copies of Xcode, and measures the room each one takes."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "XcodeReclaim looks here for copies of Xcode, and measures the room each one takes."
    scheme:
      testTargets:
        - XcodeReclaimTests

  XcodeReclaimTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - XcodeReclaimTests
    dependencies:
      - target: XcodeReclaim
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
